name: "Pull Request Feedback"
description: ""
author: "Exit0 Team"
inputs:
  capture_stdout:
    description: "Whether to capture and return the standard output of the executed commands."
    required: false
    default: "true"



outputs:
  stdout:
    description: "Standard output of the executed commands when capture_stdout is enabled."
    value: ${{ steps.entrypoint.outputs.stdout }}

runs:
  using: "composite"
  steps:
    - name: Check Action Version
      shell: bash
      run: |
        # Checking action version

        CURRENT_REF="${{ github.action_ref }}"
        if [[ "$CURRENT_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          LATEST_TAG=$(git -c 'versionsort.suffix=-' ls-remote --tags --refs --sort='v:refname' https://github.com/${{ github.action_repository }} | tail -n1 | sed 's/.*\///')
          if [ "$CURRENT_REF" != "$LATEST_TAG" ]; then
            echo "::warning::You are using $CURRENT_REF. A newer version $LATEST_TAG is available."
          fi
        fi
        echo "::endgroup::"

    - name: Install OIDC Client from Core Package
      shell: bash
      run: npm install @actions/core@1.6.0 @actions/http-client
    - name: Get Id Token
      uses: actions/github-script@v8
      id: idtoken
      with:
        script: |
          const coredemo = require('@actions/core')
          let id_token = await coredemo.getIDToken()
          const fs = require('fs')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id_token=${id_token}\n`)

    - name: Check Linked Issues
      uses: actions/github-script@v8
      id: check-issues
      with:
        script: |
          const query = `query($owner:String!, $repo:String!, $number:Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 100) {
                  nodes {
                    number
                    title
                    author {
                      __typename
                      login
                    }
                  }
                }
              }
            }
          }`;
          
          const variables = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            number: context.payload.pull_request.number
          };
          
          const result = await github.graphql(query, variables);
          const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;
          // .filter(issue => issue.author?.__typename === 'Bot');
          
          if (linkedIssues.length === 0) {
            core.setFailed('No linked issue found. Please link your task issue (the issue created by us) to this PR using the "Development" section in the PR sidebar. This allows us to run the relevant tests and provide feedback.');
          } else {
            const issueList = linkedIssues.map(issue => `#${issue.number}: ${issue.title}`).join(', ');
            core.notice(`Found ${linkedIssues.length} linked issue(s): ${issueList}`);
            
            // Extract task IDs from bot-created issues
            const taskIds = linkedIssues
              .map(issue => {
                const taskId = issue.title.match(/\[(.+?)\]/)?.[1];
                return taskId || null;
              })
              .filter(id => id !== null);
            
            core.setOutput('task_ids', taskIds.join(','));
          }

    - name: Get Template Repository Info
      id: template-info
      uses: actions/github-script@v8
      with:
        script: |
          const repo = await github.rest.repos.get({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          if (!repo.data.template_repository) {
            core.setFailed('This repository was not created from a template. This workflow only works for repositories created from a template.');
            return;
          }
          
          const templateFullName = repo.data.template_repository.full_name;
          core.setOutput('template_repo', templateFullName);
          core.notice(`Template repository: ${templateFullName}`);

    - name: Checkout Template Repository Tests
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.template-info.outputs.template_repo }}
        ref: testing
        path: template-tests
        fetch-depth: 1

    - name: Run Tests
      shell: bash
      run: |
        TASK_IDS="${{ steps.check-issues.outputs.task_ids }}"
        
        IFS=',' read -ra TASK_ID_ARRAY <<< "$TASK_IDS"
        
        for TASK_ID in "${TASK_ID_ARRAY[@]}"; do
          if [ -d "template-tests/test/${TASK_ID}" ]; then
            echo "::notice::Running tests for task: $TASK_ID"
            pytest "template-tests/test/${TASK_ID}"
          else
            echo "::warning::No test directory found for task: $TASK_ID"
          fi
        done

branding:
  icon: "award"
  color: "green"
